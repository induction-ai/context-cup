[project]
name = "context-cup-protocol"
version = "0.1.0"
description = "The driver protocol as a library: input.json and output.json models, provider-native payload adapters, and a provider-neutral view"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cup_protocol"]

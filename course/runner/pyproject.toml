[project]
name = "context-cup-runner"
version = "0.1.0"
description = "Harbor agents that run a trial and manage the thread, handing each turn to a driver"
requires-python = ">=3.12"
dependencies = ["context-cup-protocol", "pydantic>=2", "mcp>=1.25,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cup_runner"]

[tool.uv.sources]
context-cup-protocol = { workspace = true }

[project]
name = "context-cup"
version = "0.1.0"
description = "Workspace root for the Python side of Context Cup"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["course/protocol", "course/runner", "engines/python", "engines/pydantic", "engines/litellm"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "pytest-asyncio>=0.24", "mypy>=1.14", "anthropic"]

[tool.ruff]
line-length = 88
target-version = "py312"
# First-party roots, so import sorting groups the workspace packages together.
src = ["course/protocol/src", "course/runner/src", "engines/python/src", "engines/pydantic/src", "engines/litellm/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "BLE"]
# The formatter owns line length; what it leaves long (strings, comments) stays.
# PT018 would split every `assert a and b` into two asserts.
ignore = ["E501", "PT018"]

[tool.pytest.ini_options]
testpaths = ["course/protocol/tests", "course/runner/tests", "engines/python/tests", "engines/pydantic/tests", "engines/litellm/tests", "drivers", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["course/protocol/src", "engines/python/src", "engines/pydantic/src", "engines/litellm/src", "course/runner/src"]
mypy_path = "course/protocol/src:engines/python/src:engines/pydantic/src:engines/litellm/src:course/runner/src:.harbor/repo/src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "brotli", "zstandard"]
ignore_missing_imports = true

# harbor is imported by the host-side agents, which run inside harbor's own
# process. Its checkout under .harbor/repo supplies the types when present.
[[tool.mypy.overrides]]
module = ["harbor", "harbor.*"]
ignore_missing_imports = true
follow_imports = "silent"

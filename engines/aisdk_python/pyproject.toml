[project]
name = "context-cup-aisdk-python"
version = "0.1.0"
description = "AI SDK for Python engine: a driver calls ctx.llm and returns the message of its turn"
requires-python = ">=3.12"
dependencies = [
  "ai[anthropic,openai]>=0.8.0,<0.9",
  "anthropic",
  "context-cup-protocol",
  "httpx2",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cup_aisdk"]

[tool.uv.sources]
context-cup-protocol = { workspace = true }

# The engine's settings for the course (docs/protocol.md): a package is
# named by its folder. The AI SDK for Python has no Gemini provider.
[tool.context-cup]
kind = "engine"
providers = ["openai", "anthropic"]

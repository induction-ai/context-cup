[project]
name = "context-cup-engine"
version = "0.1.0"
description = "Python engine: implements the driver protocol so a driver is one small module"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cup_engine"]

name: Suite
run-name: >-
  Suite ${{ inputs.suite }} driver=${{ inputs.driver }} target=${{
  inputs.target }}${{ inputs.count && format(' count={0}', inputs.count) ||
  '' }}${{ inputs.task && format(' task={0}', inputs.task) || '' }}${{
  inputs.append && format(' append={0}', inputs.append) || '' }}

# One bin/suite run: one suite file, one driver, one target. Results go to the
# database in DATABASE_URL, and the suite row links back to this run. The
# site's deploy migrates that database (pnpm prelaunch), so this doesn't.
# Runs need no concurrency group: each task's cap in the suite file counts
# jobs on every machine through that same database (course/suite/src/
# shared_budgets.ts), so two toolathlon runs interleave their tasks and take
# turns only on a task that acts on shared live accounts.
# The suite and target option lists mirror suites/ and targets.json;
# course/suite/tests/workflow.test.ts fails when they drift. The driver is
# typed, not picked, so new drivers need no edit here.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite file to run (suites/<suite>.json)"
        required: true
        type: choice
        default: "<choose a suite>"
        options:
          - "<choose a suite>"
          - smoke_tau
          - smoke_toolathlon
          - tau_banking
          - toolathlon
          - toolathlon_local
      # Free text rather than a choice so a merged driver is runnable at once,
      # without a follow-up edit here; bin/suite rejects any name that isn't
      # a runnable package under drivers/.
      driver:
        description: "Driver: its folder under drivers/ (e.g. base_python)"
        required: true
        type: string
      target:
        description: "Target model (targets.json); the driver must support its provider"
        required: true
        type: choice
        default: gpt-6.1-sol@medium
        options:
          - claude-sonnet-4-6
          - claude-sonnet-5-5
          - gemini-3.1-pro-preview
          - gpt-5.5@low
          - gpt-5.5@medium
          - gpt-5.6-sol@medium
          - gpt-6-sol@medium
          - gpt-6.1-sol@medium
      count:
        description: "Trials per task. Blank = the suite file’s count (else 1)."
        required: false
        type: string
        default: ""
      task:
        description: "Optional: only these tasks (space-separated). Blank = all in the suite."
        required: false
        type: string
        default: ""
      append:
        description: "Optional: a suite id to top up instead of starting a new suite. Runs only the trials each of its tasks still owes to its count; pick the same suite, driver, and target. Blank = a new suite."
        required: false
        type: string
        default: ""
      retry_errors:
        description: "After the suite finishes, rerun the trials that failed, up to this many more passes (0 = off). Skipped when more than half the trials failed."
        required: false
        type: number
        default: 3
      harbor_env:
        description: "Where harbor tasks run their environment"
        required: false
        type: choice
        default: daytona
        options:
          - daytona
          - docker

jobs:
  suite:
    runs-on: ubuntu-latest
    # GitHub's ceiling for a hosted runner.
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      # A choice input can't be empty and required: true is always satisfied,
      # so the suite default is a sentinel and the run fails fast here instead
      # of benchmarking a suite nobody picked. A dispatch through the API can
      # still leave the driver blank.
      - name: Require an explicit suite and driver
        if: inputs.suite == '<choose a suite>' || inputs.driver == ''
        env:
          SUITE: ${{ inputs.suite }}
          DRIVER: ${{ inputs.driver }}
        run: |
          [ "$SUITE" = "<choose a suite>" ] && echo "::error::No suite selected; re-run and pick a suite from the dropdown."
          [ -z "$DRIVER" ] && echo "::error::No driver given; re-run and name a folder under drivers/."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5

      # The driver is typed, so catch a typo before the minutes of setup.
      # bin/suite still decides whether the package is runnable.
      - name: Require an existing driver
        env:
          DRIVER: ${{ inputs.driver }}
        run: |
          case "$DRIVER" in */*|.*) ok=false ;; *) [ -d "drivers/$DRIVER" ] && ok=true || ok=false ;; esac
          if [ "$ok" != true ]; then
            echo "::error::No driver '$DRIVER' under drivers/. Drivers: $(ls drivers | tr '\n' ' ')"
            exit 1
          fi

      # Whether the run has toolathlon tasks, which decides the auth steps.
      - name: Detect toolathlon suite
        id: suite_kind
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            toolathlon|smoke_toolathlon|toolathlon_local)
              echo "Suite '$SUITE' runs toolathlon tasks; will restore toolathlon auth."
              echo "toolathlon=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Suite '$SUITE' has no toolathlon tasks; skipping toolathlon auth."
              echo "toolathlon=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Real toolathlon MCP credentials, base64-encoded into a repo secret
      # (the zip is gitignored, so it's never in the checkout). Decoded into
      # secrets/toolathlon_auth_configs.zip where bin/suite expects it; without
      # the secret, toolathlon tasks fall back to placeholder configs.
      - name: Restore toolathlon auth configs
        if: steps.suite_kind.outputs.toolathlon == 'true'
        env:
          AUTH_B64: ${{ secrets.TOOLATHLON_AUTH_CONFIGS_B64 }}
        run: |
          if [ -z "$AUTH_B64" ]; then
            echo "TOOLATHLON_AUTH_CONFIGS_B64 not set; toolathlon uses placeholder configs."
            exit 0
          fi
          mkdir -p secrets
          printf '%s' "$AUTH_B64" | base64 -d > secrets/toolathlon_auth_configs.zip

      # The notion tasks' login, kept fresh by the Notion Grant Refresh
      # workflow (notion_grant_refresh.yml). Only that workflow may hold the
      # refresh token: a refresh here would rotate the grant behind it and a
      # second use of the spent token revokes everything. The access token
      # alone lasts the run.
      - name: Restore notion MCP auth state
        if: steps.suite_kind.outputs.toolathlon == 'true'
        env:
          MCP_AUTH_B64: ${{ secrets.TOOLATHLON_MCP_AUTH_B64 }}
        run: |
          if [ -z "$MCP_AUTH_B64" ]; then
            echo "TOOLATHLON_MCP_AUTH_B64 not set; notion toolathlon tasks refuse to launch."
            exit 0
          fi
          mkdir -p secrets/mcp
          printf '%s' "$MCP_AUTH_B64" | base64 -d | tar xzf - -C secrets/mcp
          # The mtime stays: the token's remaining life is measured from it.
          # No tokens file (a mis-tarred secret) is left for bin/suite to
          # report, with the login instructions, when a notion task launches.
          shopt -s nullglob
          for f in secrets/mcp/*/*_tokens.json; do
            jq 'del(.refresh_token)' "$f" > "$f.tmp"
            touch -r "$f" "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Setup
        uses: ./.github/actions/setup

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          # The toolathlon harbor image is ~2.5GB+; ubuntu-latest only has
          # ~14GB free on /. Remove preinstalled toolchains we don't use to
          # make room before the docker build (avoids "no space left on device").
          # Do NOT delete $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache): setup-uv
          # installs uv and the Python interpreter there, and harbor needs uv.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "Disk after cleanup:"; df -h /

      - name: Run suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUITE: ${{ inputs.suite }}
          DRIVER: ${{ inputs.driver }}
          TARGET: ${{ inputs.target }}
          COUNT: ${{ inputs.count }}
          TASK: ${{ inputs.task }}
          HARBOR_ENV: ${{ inputs.harbor_env || 'daytona' }}
          RETRY_ERRORS: ${{ inputs.retry_errors }}
          APPEND: ${{ inputs.append }}
        run: |
          args=("$SUITE" --driver "$DRIVER" --target "$TARGET" --harbor_env "$HARBOR_ENV" --log_dir ".temp/suites")
          [ -n "$COUNT" ] && args+=(--count "$COUNT")
          # Unquoted expansion is intentional: each blank-free token becomes a
          # separate value for the repeatable --task flag.
          [ -n "$TASK" ] && args+=(--task $TASK)
          args+=(--retry_errors "${RETRY_ERRORS:-3}")
          [ -n "$APPEND" ] && args+=(--append "$APPEND")
          bin/suite "${args[@]}"

      - name: Upload suite summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: suite-summary
          include-hidden-files: true
          path: |
            .temp/suites/*/results.json
            .temp/suites/*/results.txt
            .temp/suites/*/logs/suite.log
          if-no-files-found: ignore

      # Sandboxes are deleted by the harbor process that created them, and a
      # cancelled job SIGKILLs that process, so a cancel strands every sandbox
      # the run had open, each holding its CPU/memory/disk reservation against
      # the organization quota until its auto-stop interval expires. Sandboxes
      # whose build failed are never reclaimed at all. Both carry this run's
      # suite id as a label, which is what makes them findable here.
      # Runs before the log steps so the quota comes back as early as possible.
      - name: Delete this run's Daytona sandboxes
        # Same default as the run step: a blank input means daytona.
        if: always() && (inputs.harbor_env || 'daytona') == 'daytona'
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          # bin/suite generates its own suite id and logs under that name, so
          # the id is read back from the directory it created.
          shopt -s nullglob
          for dir in .temp/suites/*/; do
            bin/daytona_sweep suite --suite_id "$(basename "$dir")"
          done

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: suite-logs
          include-hidden-files: true
          path: .temp/suites/
          if-no-files-found: ignore

      - name: Suite summary
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          shopt -s nullglob
          {
            echo "## Suite run"
            echo ""
            echo "- **Suite:** \`${{ inputs.suite }}\`"
            echo "- **Driver:** \`${{ inputs.driver }}\`"
            echo "- **Target:** \`${{ inputs.target }}\`"
            for dir in .temp/suites/*/; do
              id=$(basename "$dir")
              echo "- **Suite id:** \`$id\`${SITE_URL:+ (${SITE_URL%/}/suites/$id)}"
              if [ -f "$dir/results.txt" ]; then
                echo ""
                echo '```'
                cat "$dir/results.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The suite run leaves multi-GB harbor images and build cache on disk.
      - name: Reclaim disk
        if: always()
        run: |
          docker system prune -af || true
          df -h /

[project]
name = "base-litellm"
version = "0.1.0"
description = "Clips any tool result larger than max_bytes before it reaches the model. base_python, on LiteLLM."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.context-cup]
kind = "driver"
extends = "litellm"
providers = ["openai", "anthropic", "gemini"]

[tool.context-cup.config]
max_bytes = 100_000
